<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giigle</title>
<link rel="icon" href="logo.png">
<style>
  /* ---------- Colors pulled from the Giigle logo ---------- */
  :root {
    --purple: #7a00ff;
    --cyan: #00ffff;
    --green: #00ff22;
    --pink: #ff00ff;
    --ink: #202124;
    --muted: #5f6368;
    --line: #dfe1e5;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--ink);
    background: #fff;
  }

  /* Rainbow strip across the top, matches the logo colors */
  .topbar {
    height: 6px;
    background: linear-gradient(90deg, var(--purple), var(--cyan), var(--green), var(--pink));
  }

  /* ---------- Main centered area ---------- */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px 80px;
  }

  .logo {
    width: min(340px, 75vw);
    height: auto;
    margin-bottom: 28px;
    user-select: none;
  }

  /* ---------- Search box ---------- */
  form { width: min(600px, 100%); }

  .box-wrap { position: relative; }

  .search-box {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 52px;
    padding: 0 20px;
    border: 1px solid var(--line);
    border-radius: 26px;
    background: #fff;
    transition: box-shadow .15s, border-color .15s;
  }
  .search-box:hover,
  .search-box:focus-within {
    border-color: transparent;
    box-shadow: 0 2px 10px rgba(122, 0, 255, .25);
  }
  .search-box svg { flex: none; fill: var(--muted); }

  .search-box input {
    flex: 1;
    border: 0;
    outline: 0;
    font-size: 17px;
    background: transparent;
    color: var(--ink);
  }

  /* When suggestions are open, square off the bottom corners */
  .box-wrap.open .search-box {
    border-radius: 26px 26px 0 0;
    border-color: transparent;
    box-shadow: 0 2px 10px rgba(122, 0, 255, .25);
  }

  /* ---------- Suggestions dropdown ---------- */
  .suggestions {
    display: none;
    position: absolute;
    left: 0;
    right: 0;
    top: 52px;
    margin: 0;
    padding: 6px 0 10px;
    list-style: none;
    background: #fff;
    border-radius: 0 0 26px 26px;
    box-shadow: 0 6px 10px rgba(122, 0, 255, .2);
    z-index: 10;
    text-align: left;
  }
  .box-wrap.open .suggestions { display: block; }

  .suggestions li {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 8px 20px;
    cursor: pointer;
    font-size: 16px;
  }
  .suggestions li svg { fill: var(--muted); flex: none; }
  .suggestions li:hover,
  .suggestions li.active { background: #f5f0ff; }

  /* ---------- Buttons ---------- */
  .buttons {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 26px;
  }
  .btn {
    font-size: 14px;
    padding: 11px 18px;
    border: 1px solid #f1f3f4;
    border-radius: 6px;
    background: #f8f9fa;
    color: var(--ink);
    cursor: pointer;
    transition: border-color .15s, box-shadow .15s;
  }
  .btn:hover {
    border-color: var(--purple);
    box-shadow: 0 1px 4px rgba(122, 0, 255, .3);
  }

  .tagline {
    margin-top: 28px;
    color: var(--muted);
    font-size: 14px;
  }
  .tagline b { color: var(--purple); }

  /* ---------- Footer ---------- */
  footer {
    padding: 16px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    background: #f8f9fa;
    border-top: 1px solid var(--line);
  }
</style>
</head>
<body>

<div class="topbar"></div>

<main>
  <!-- The logo image sits in the same folder as this file -->
  <img class="logo" src="logo.png" alt="Giigle">

  <!-- A normal GET form sends the user to search/?q=their+words -->
  <form id="searchForm" action="search/" method="get" autocomplete="off">
    <div class="box-wrap" id="boxWrap">
      <div class="search-box">
        <!-- magnifying glass icon -->
        <svg width="20" height="20" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input id="q" name="q" type="text" placeholder="Search Giigle" aria-label="Search Giigle" autofocus>
      </div>
      <ul class="suggestions" id="suggestions"></ul>
    </div>

    <div class="buttons">
      <button class="btn" type="submit">Giigle Search</button>
      <button class="btn" type="button" id="giggly">I'm Feeling Giggly</button>
    </div>
  </form>

  <p class="tagline">Pronounced <b>giggle</b>. Search the web and have fun doing it.</p>
</main>

<footer>Giigle &copy; <span id="year"></span> &middot; Search with a smile</footer>

<script>
  // ---------- Grab the page elements we need ----------
  const form = document.getElementById('searchForm');
  const input = document.getElementById('q');
  const wrap = document.getElementById('boxWrap');
  const list = document.getElementById('suggestions');
  document.getElementById('year').textContent = new Date().getFullYear();

  let timer = null;     // used to wait a moment while the user is typing
  let items = [];       // current suggestion strings
  let active = -1;      // which suggestion is highlighted (-1 means none)

  // Small clock icon used in each suggestion row
  const ICON = '<svg width="18" height="18" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>';

  // ---------- Live suggestions (from Wikipedia's open search) ----------
  async function loadSuggestions() {
    const text = input.value.trim();
    if (!text) { closeList(); return; }

    const url = 'https://en.wikipedia.org/w/api.php?action=opensearch&limit=6&namespace=0&format=json&origin=*&search=' + encodeURIComponent(text);

    try {
      const res = await fetch(url);
      const data = await res.json();
      // Ignore old answers if the user kept typing
      if (text !== input.value.trim()) return;
      items = data[1] || [];
      drawList();
    } catch (err) {
      closeList(); // if the network fails, just hide the list
    }
  }

  // Build the dropdown rows
  function drawList() {
    list.innerHTML = '';
    active = -1;
    if (!items.length) { closeList(); return; }

    items.forEach(function (word, i) {
      const li = document.createElement('li');
      li.innerHTML = ICON;
      const span = document.createElement('span');
      span.textContent = word; // textContent keeps things safe
      li.appendChild(span);
      // mousedown fires before the input loses focus, so the click always lands
      li.addEventListener('mousedown', function (e) {
        e.preventDefault();
        input.value = word;
        form.requestSubmit();
      });
      list.appendChild(li);
    });
    wrap.classList.add('open');
  }

  function closeList() {
    wrap.classList.remove('open');
    items = [];
    active = -1;
  }

  // Highlight a row with the arrow keys
  function setActive(n) {
    const rows = list.children;
    if (!rows.length) return;
    if (active >= 0) rows[active].classList.remove('active');
    active = (n + rows.length) % rows.length; // wrap around
    rows[active].classList.add('active');
    input.value = items[active];
  }

  input.addEventListener('input', function () {
    clearTimeout(timer);
    timer = setTimeout(loadSuggestions, 150); // wait 150ms after typing stops
  });

  input.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown') { e.preventDefault(); setActive(active + 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(active - 1); }
    else if (e.key === 'Escape') { closeList(); }
  });

  input.addEventListener('blur', closeList);

  // Do not search for nothing
  form.addEventListener('submit', function (e) {
    if (!input.value.trim()) e.preventDefault();
  });

  // ---------- I'm Feeling Giggly: jump to a random article ----------
  document.getElementById('giggly').addEventListener('click', async function () {
    const btn = this;
    btn.textContent = 'Giggling...';
    try {
      const res = await fetch('https://en.wikipedia.org/api/rest_v1/page/random/summary');
      const data = await res.json();
      window.location.href = data.content_urls.desktop.page;
    } catch (err) {
      // If something breaks, fall back to the normal Wikipedia random page
      window.location.href = 'https://en.wikipedia.org/wiki/Special:Random';
    }
  });
</script>
</body>
</html>
