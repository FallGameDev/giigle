<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giigle Search</title>
<link rel="icon" href="../logo.png">
<style>
  /* ---------- Colors pulled from the Giigle logo ---------- */
  :root {
    --purple: #7a00ff;
    --cyan: #00ffff;
    --green: #00ff22;
    --pink: #ff00ff;
    --ink: #202124;
    --muted: #5f6368;
    --line: #dfe1e5;
    --link: #5b00c4;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--ink);
    background: #fff;
  }

  /* ---------- Sticky header ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: #fff;
    border-bottom: 1px solid var(--line);
  }
  .rainbow {
    height: 4px;
    background: linear-gradient(90deg, var(--purple), var(--cyan), var(--green), var(--pink));
  }
  .head-row {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 12px 24px 0;
  }
  .head-row img { height: 40px; width: auto; display: block; }

  form { flex: 1; max-width: 640px; }
  .box-wrap { position: relative; }
  .search-box {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 44px;
    padding: 0 16px;
    border: 1px solid var(--line);
    border-radius: 22px;
    background: #fff;
  }
  .search-box:hover,
  .search-box:focus-within {
    border-color: transparent;
    box-shadow: 0 1px 8px rgba(122, 0, 255, .3);
  }
  .search-box input {
    flex: 1;
    border: 0;
    outline: 0;
    font-size: 16px;
    background: transparent;
    color: var(--ink);
    min-width: 0;
  }
  .search-box button {
    border: 0;
    background: transparent;
    cursor: pointer;
    padding: 4px;
    display: flex;
  }
  .search-box svg { fill: var(--purple); }

  .box-wrap.open .search-box {
    border-radius: 22px 22px 0 0;
    border-color: transparent;
    box-shadow: 0 2px 8px rgba(122, 0, 255, .25);
  }
  .suggestions {
    display: none;
    position: absolute;
    left: 0; right: 0; top: 44px;
    margin: 0;
    padding: 4px 0 10px;
    list-style: none;
    background: #fff;
    border-radius: 0 0 22px 22px;
    box-shadow: 0 6px 8px rgba(122, 0, 255, .2);
  }
  .box-wrap.open .suggestions { display: block; }
  .suggestions li { padding: 8px 18px; cursor: pointer; font-size: 15px; }
  .suggestions li:hover,
  .suggestions li.active { background: #f5f0ff; }

  /* ---------- Tabs (All / Images) ---------- */
  .tabs { display: flex; gap: 6px; padding: 4px 24px 0 152px; }
  .tabs a {
    padding: 10px 14px 9px;
    font-size: 14px;
    color: var(--muted);
    text-decoration: none;
    border-bottom: 3px solid transparent;
  }
  .tabs a:hover { color: var(--ink); }
  .tabs a.on { color: var(--purple); border-bottom-color: var(--purple); font-weight: 600; }

  /* ---------- Page layout ---------- */
  .layout {
    display: grid;
    grid-template-columns: minmax(0, 650px) 360px;
    gap: 48px;
    padding: 18px 24px 40px 152px;
  }
  .layout.wide { display: block; }  /* image tab uses the full width */

  .stats { color: var(--muted); font-size: 13px; margin-bottom: 18px; }

  .didyoumean { margin: 0 0 18px; font-size: 16px; }
  .didyoumean a { color: var(--link); font-style: italic; font-weight: 600; }

  /* ---------- A single web result ---------- */
  .result { margin-bottom: 28px; }
  .result .site { font-size: 13px; color: var(--muted); margin-bottom: 3px; word-break: break-all; }
  .result h3 { margin: 0 0 4px; font-size: 20px; font-weight: 400; line-height: 1.3; }
  .result h3 a { color: var(--link); text-decoration: none; }
  .result h3 a:hover { text-decoration: underline; }
  .result .snippet { font-size: 14px; line-height: 1.58; color: #3c4043; }
  .result .snippet b { color: var(--ink); }
  .result .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }

  /* ---------- Info card on the right ---------- */
  .card {
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    align-self: start;
    position: sticky;
    top: 130px;
  }
  .card img { width: 100%; max-height: 220px; object-fit: cover; border-radius: 10px; margin-bottom: 12px; }
  .card h2 { margin: 0 0 2px; font-size: 22px; }
  .card .desc { color: var(--muted); font-size: 13px; margin-bottom: 10px; text-transform: capitalize; }
  .card p { font-size: 14px; line-height: 1.55; margin: 0 0 10px; }
  .card a { color: var(--link); font-size: 14px; }

  /* ---------- Image grid ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 14px;
  }
  .grid a {
    display: block;
    text-decoration: none;
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    background: #fafafa;
  }
  .grid a:hover { box-shadow: 0 2px 10px rgba(122, 0, 255, .3); }
  .grid img { width: 100%; height: 160px; object-fit: cover; display: block; background: #eee; }
  .grid span {
    display: block;
    padding: 8px 10px;
    font-size: 12px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ---------- Paging buttons ---------- */
  .pager { display: flex; align-items: center; gap: 14px; margin-top: 10px; }
  .pager a, .pager span {
    padding: 10px 18px;
    border-radius: 20px;
    font-size: 14px;
    text-decoration: none;
  }
  .pager a { border: 1px solid var(--purple); color: var(--purple); }
  .pager a:hover { background: #f5f0ff; }
  .pager span { color: var(--muted); }

  /* ---------- Messages ---------- */
  .msg { color: var(--muted); font-size: 15px; line-height: 1.6; }
  .msg b { color: var(--ink); }
  .loading { color: var(--purple); font-weight: 600; }

  /* ---------- Small screens ---------- */
  @media (max-width: 1000px) {
    .layout { grid-template-columns: 1fr; padding-left: 24px; gap: 10px; }
    .card { position: static; order: -1; }
    .tabs { padding-left: 24px; }
  }
  @media (max-width: 600px) {
    .head-row { flex-wrap: wrap; gap: 10px; padding: 10px 14px 0; }
    form { flex-basis: 100%; }
    .layout, .tabs { padding-left: 14px; padding-right: 14px; }
  }
</style>
</head>
<body>

<header>
  <div class="rainbow"></div>
  <div class="head-row">
    <!-- Clicking the logo goes back to the homepage (one folder up) -->
    <a href="../"><img src="../logo.png" alt="Giigle home"></a>

    <form id="searchForm" action="./" method="get" autocomplete="off">
      <div class="box-wrap" id="boxWrap">
        <div class="search-box">
          <input id="q" name="q" type="text" aria-label="Search Giigle">
          <button type="submit" aria-label="Search">
            <svg width="22" height="22" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          </button>
        </div>
        <ul class="suggestions" id="suggestions"></ul>
      </div>
    </form>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>

<div class="layout" id="layout">
  <section id="results"></section>
  <aside id="side"></aside>
</div>

<script>
  /* =========================================================
     GIIGLE SEARCH PAGE
     - Default engine: Wikipedia (real results, free, no key).
     - Images: Wikimedia Commons (real images, free, no key).
     - Optional: paste a Google Programmable Search key and ID
       below to get full web results on the All tab.
       Get them at https://programmablesearchengine.google.com
       (free tier is 100 searches per day).
     ========================================================= */
  const GOOGLE_API_KEY = '';  // example: 'AIzaSy...'
  const GOOGLE_CX = '';       // example: 'a1b2c3d4e5f6g7h8i'
  const USE_GOOGLE = Boolean(GOOGLE_API_KEY && GOOGLE_CX);

  const PER_PAGE = 10;        // results per page for the All tab
  const IMAGES_PER_PAGE = 24; // results per page for the Images tab

  // ---------- Read the question from the web address ----------
  const params = new URLSearchParams(window.location.search);
  const query = (params.get('q') || '').trim();
  const tab = params.get('tab') === 'images' ? 'images' : 'all';
  const page = Math.max(1, parseInt(params.get('p'), 10) || 1);

  // ---------- Page elements ----------
  const resultsEl = document.getElementById('results');
  const sideEl = document.getElementById('side');
  const layoutEl = document.getElementById('layout');
  const input = document.getElementById('q');

  input.value = query;
  document.title = query ? query + ' - Giigle Search' : 'Giigle Search';

  // ---------- Small helper functions ----------

  // Build a link back to this page with new settings
  function link(extra) {
    const p = new URLSearchParams();
    p.set('q', query);
    if ((extra.tab || tab) === 'images') p.set('tab', 'images');
    if (extra.p && extra.p > 1) p.set('p', extra.p);
    return './?' + p.toString();
  }

  // Turn any text into safe text for putting inside HTML
  function esc(text) {
    const d = document.createElement('div');
    d.textContent = text == null ? '' : String(text);
    return d.innerHTML;
  }

  // Wikipedia snippets contain HTML. We rebuild them by hand so only
  // bold match words survive, which keeps things safe.
  function cleanSnippet(html) {
    const doc = new DOMParser().parseFromString('<div>' + html + '</div>', 'text/html');
    let out = '';
    doc.body.firstChild.childNodes.forEach(function (node) {
      if (node.nodeType === 3) out += esc(node.textContent);
      else if (node.classList && node.classList.contains('searchmatch')) out += '<b>' + esc(node.textContent) + '</b>';
      else out += esc(node.textContent);
    });
    return out;
  }

  function niceDate(iso) {
    const d = new Date(iso);
    return isNaN(d) ? '' : d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
  }

  async function getJSON(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error('Request failed: ' + res.status);
    return res.json();
  }

  // ---------- Draw the tabs ----------
  document.getElementById('tabs').innerHTML =
    '<a class="' + (tab === 'all' ? 'on' : '') + '" href="' + link({ tab: 'all' }) + '">All</a>' +
    '<a class="' + (tab === 'images' ? 'on' : '') + '" href="' + link({ tab: 'images' }) + '">Images</a>';

  // ---------- Draw the Previous / Next buttons ----------
  function pager(hasNext) {
    let html = '<div class="pager">';
    if (page > 1) html += '<a href="' + link({ p: page - 1 }) + '">&larr; Previous</a>';
    html += '<span>Page ' + page + '</span>';
    if (hasNext) html += '<a href="' + link({ p: page + 1 }) + '">Next &rarr;</a>';
    return html + '</div>';
  }

  // =========================================================
  // ALL TAB: Wikipedia results
  // =========================================================
  async function searchWikipedia() {
    const offset = (page - 1) * PER_PAGE;
    const url = 'https://en.wikipedia.org/w/api.php?action=query&list=search&format=json&origin=*' +
      '&srlimit=' + PER_PAGE + '&sroffset=' + offset +
      '&srinfo=totalhits|suggestion&srprop=snippet|wordcount|timestamp' +
      '&srsearch=' + encodeURIComponent(query);

    const data = await getJSON(url);
    const hits = data.query.search;
    const total = data.query.searchinfo.totalhits;
    const suggestion = data.query.searchinfo.suggestion;

    if (!hits.length) return showNothing(suggestion);

    let html = '<div class="stats">About ' + total.toLocaleString() + ' results</div>';

    // "Did you mean" for typos
    if (suggestion) {
      html += '<p class="didyoumean">Did you mean: <a href="' + link({}).replace(/q=[^&]*/, 'q=' + encodeURIComponent(suggestion)) + '">' + esc(suggestion) + '</a></p>';
    }

    hits.forEach(function (h) {
      const pageUrl = 'https://en.wikipedia.org/wiki/' + encodeURIComponent(h.title.replace(/ /g, '_'));
      html += '<div class="result">' +
        '<div class="site">en.wikipedia.org &rsaquo; wiki &rsaquo; ' + esc(h.title) + '</div>' +
        '<h3><a href="' + pageUrl + '">' + esc(h.title) + '</a></h3>' +
        '<div class="snippet">' + cleanSnippet(h.snippet) + '...</div>' +
        '<div class="meta">' + h.wordcount.toLocaleString() + ' words &middot; Updated ' + niceDate(h.timestamp) + '</div>' +
        '</div>';
    });

    html += pager(offset + PER_PAGE < total);
    resultsEl.innerHTML = html;

    // Show an info card for the top result on page 1
    if (page === 1) loadInfoCard(hits[0].title);
  }

  // =========================================================
  // ALL TAB (optional): Google Programmable Search results
  // =========================================================
  async function searchGoogle() {
    const start = (page - 1) * PER_PAGE + 1; // Google counts from 1
    const url = 'https://www.googleapis.com/customsearch/v1?key=' + encodeURIComponent(GOOGLE_API_KEY) +
      '&cx=' + encodeURIComponent(GOOGLE_CX) + '&num=' + PER_PAGE + '&start=' + start +
      '&q=' + encodeURIComponent(query);

    const data = await getJSON(url);
    const items = data.items || [];
    if (!items.length) return showNothing();

    const total = parseInt(data.searchInformation.totalResults, 10) || 0;
    let html = '<div class="stats">About ' + total.toLocaleString() + ' results</div>';

    items.forEach(function (it) {
      html += '<div class="result">' +
        '<div class="site">' + esc(it.displayLink) + '</div>' +
        '<h3><a href="' + esc(it.link) + '">' + esc(it.title) + '</a></h3>' +
        '<div class="snippet">' + esc(it.snippet || '') + '</div>' +
        '</div>';
    });

    // Google only lets you page up to result number 100
    html += pager(start + PER_PAGE <= Math.min(total, 91));
    resultsEl.innerHTML = html;

    // Still use Wikipedia for the info card
    if (page === 1) {
      try {
        const w = await getJSON('https://en.wikipedia.org/w/api.php?action=opensearch&limit=1&namespace=0&format=json&origin=*&search=' + encodeURIComponent(query));
        if (w[1] && w[1][0]) loadInfoCard(w[1][0]);
      } catch (e) { /* the card is optional, so ignore errors */ }
    }
  }

  // =========================================================
  // Info card (right side) using Wikipedia's summary
  // =========================================================
  async function loadInfoCard(title) {
    try {
      const s = await getJSON('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(title.replace(/ /g, '_')));
      if (!s.extract || s.type === 'disambiguation') return;
      sideEl.innerHTML = '<div class="card">' +
        (s.thumbnail ? '<img src="' + esc(s.thumbnail.source) + '" alt="' + esc(s.title) + '">' : '') +
        '<h2>' + esc(s.title) + '</h2>' +
        (s.description ? '<div class="desc">' + esc(s.description) + '</div>' : '') +
        '<p>' + esc(s.extract) + '</p>' +
        '<a href="' + esc(s.content_urls.desktop.page) + '">Read more on Wikipedia</a>' +
        '</div>';
    } catch (e) { /* no card, no problem */ }
  }

  // =========================================================
  // IMAGES TAB: Wikimedia Commons
  // =========================================================
  async function searchImages() {
    layoutEl.classList.add('wide'); // images use the full width
    sideEl.style.display = 'none';

    const offset = (page - 1) * IMAGES_PER_PAGE;
    const url = 'https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*' +
      '&generator=search&gsrnamespace=6&gsrlimit=' + IMAGES_PER_PAGE + '&gsroffset=' + offset +
      '&gsrsearch=' + encodeURIComponent(query) +
      '&prop=imageinfo&iiprop=url|mime&iiurlwidth=400';

    const data = await getJSON(url);
    if (!data.query) return showNothing();

    // The API gives an object, so turn it into a list and sort by relevance
    const pages = Object.values(data.query.pages).sort(function (a, b) { return a.index - b.index; });

    // Keep only real pictures (skip audio, video, and so on)
    const pics = pages.filter(function (p) {
      return p.imageinfo && p.imageinfo[0].thumburl && /^image\//.test(p.imageinfo[0].mime);
    });
    if (!pics.length) return showNothing();

    let html = '<div class="grid">';
    pics.forEach(function (p) {
      const info = p.imageinfo[0];
      const name = p.title.replace(/^File:/, '').replace(/\.[^.]+$/, '').replace(/_/g, ' ');
      html += '<a href="' + esc(info.descriptionurl) + '" title="' + esc(name) + '">' +
        '<img loading="lazy" src="' + esc(info.thumburl) + '" alt="' + esc(name) + '">' +
        '<span>' + esc(name) + '</span></a>';
    });
    html += '</div>' + pager(Boolean(data.continue));
    resultsEl.innerHTML = html;
  }

  // ---------- "No results" message ----------
  function showNothing(suggestion) {
    let html = '<div class="msg">Your search for <b>' + esc(query) + '</b> did not match anything.' +
      '<br><br>Try these tips:<br>&bull; Check your spelling<br>&bull; Use fewer words<br>&bull; Try a more general word</div>';
    if (suggestion) {
      html += '<p class="didyoumean">Did you mean: <a href="' + link({}).replace(/q=[^&]*/, 'q=' + encodeURIComponent(suggestion)) + '">' + esc(suggestion) + '</a></p>';
    }
    resultsEl.innerHTML = html;
  }

  // =========================================================
  // START: decide which search to run
  // =========================================================
  async function run() {
    if (!query) {
      resultsEl.innerHTML = '<div class="msg">Type something in the box above to start searching.</div>';
      return;
    }
    resultsEl.innerHTML = '<div class="loading">Giigling...</div>';
    try {
      if (tab === 'images') await searchImages();
      else if (USE_GOOGLE) await searchGoogle();
      else await searchWikipedia();
    } catch (err) {
      resultsEl.innerHTML = '<div class="msg"><b>Oops!</b> Giigle could not get results right now. ' +
        'Check your internet and try again.</div>';
      console.error(err);
    }
  }
  run();

  // =========================================================
  // Live suggestions in the search box
  // =========================================================
  const form = document.getElementById('searchForm');
  const wrap = document.getElementById('boxWrap');
  const list = document.getElementById('suggestions');
  let timer = null, items = [], active = -1;

  async function loadSuggestions() {
    const text = input.value.trim();
    if (!text) return closeList();
    try {
      const data = await getJSON('https://en.wikipedia.org/w/api.php?action=opensearch&limit=6&namespace=0&format=json&origin=*&search=' + encodeURIComponent(text));
      if (text !== input.value.trim()) return; // user kept typing, skip old answer
      items = data[1] || [];
      drawList();
    } catch (e) { closeList(); }
  }

  function drawList() {
    list.innerHTML = '';
    active = -1;
    if (!items.length) return closeList();
    items.forEach(function (word) {
      const li = document.createElement('li');
      li.textContent = word;
      li.addEventListener('mousedown', function (e) {
        e.preventDefault();
        input.value = word;
        form.requestSubmit();
      });
      list.appendChild(li);
    });
    wrap.classList.add('open');
  }

  function closeList() { wrap.classList.remove('open'); items = []; active = -1; }

  function setActive(n) {
    const rows = list.children;
    if (!rows.length) return;
    if (active >= 0) rows[active].classList.remove('active');
    active = (n + rows.length) % rows.length;
    rows[active].classList.add('active');
    input.value = items[active];
  }

  input.addEventListener('input', function () {
    clearTimeout(timer);
    timer = setTimeout(loadSuggestions, 150);
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown') { e.preventDefault(); setActive(active + 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(active - 1); }
    else if (e.key === 'Escape') closeList();
  });
  input.addEventListener('blur', closeList);

  // Keep the current tab when searching again
  form.addEventListener('submit', function (e) {
    if (!input.value.trim()) { e.preventDefault(); return; }
    if (tab === 'images') {
      const hidden = document.createElement('input');
      hidden.type = 'hidden'; hidden.name = 'tab'; hidden.value = 'images';
      form.appendChild(hidden);
    }
  });
</script>
</body>
</html>
